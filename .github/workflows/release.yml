name: Build Release

on: 
  workflow_dispatch:

env:
  packageName: "io.github.kaoruboy.rcws"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: get version
        id: version
        uses: notiz-dev/github-action-json-property@7c8cf5cc36eb85d8d287a8086a39dac59628eb31
        with: 
            path: "package.json"
            prop_path: "version"
    
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.prop }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ env.packageName }}-${{ steps.version.outputs.prop }}.unitypackage" >> $GITHUB_ENV
      
      - name: Prepare Package
        run: |
          packagePath="Packages/${{ env.packageName }}"
          mkdir -p "$packagePath"

          while IFS= read -r metaFile; do
            relativePath="${metaFile#./}"
            targetPath="$packagePath/$relativePath"
            mkdir -p "$(dirname "$targetPath")"
            echo Copying "$metaFile" to "$targetPath"
            cp "$metaFile" "$targetPath"

            assetFile="${metaFile%.meta}"
            if [ -f "$assetFile" ]; then
              echo Copying "$assetFile" to "${targetPath%.meta}"
              cp "$assetFile" "${targetPath%.meta}"
            fi
          done < <(find . -name '*.meta')

          find "$packagePath" -type f -name '*.meta' | sort > metaList

      - name: Create Zip
        run: |
          cd "Packages/${{ env.packageName }}"
          zip -r ../../"${{ env.zipFile }}" *
          
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@cfcd3cf0391a5ef1306342794866a9897c32af0b
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
        
      - name: Make Release
        uses: softprops/action-gh-release@1e07f4398721186383de40550babbdf2b84acfc5
        with:
          tag_name: ${{ steps.version.outputs.prop }}
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            package.json

      - name: Update VPM repository
        run: gh workflow run build-listing.yml --repo KaoruBoy/vcc --ref main
        env:
          GH_TOKEN: ${{ secrets.VCC_REPO_TOKEN }}